# Builds the Rinne AppImage (Rinne-<version>-x86_64.AppImage + .zsync for AppImage updaters).
# Built on Ubuntu 22.04 so it runs on distributions from 2022 on. Self-tested before upload.
#
# Runs on version tags (v*) — the files are attached to that GitHub release — and can be
# started by hand from the Actions tab ("Run workflow"), which uploads them as build artifacts.

name: Linux AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's X11 plugin needs these; installing them lets PyInstaller bundle the ones minimal
      # systems lack (e.g. libxcb-cursor). zsync makes the update file.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsync libegl1 libgl1 libfontconfig1 \
            libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q

      - name: Build AppImage
        run: packaging/linux/build_appimage.sh

      - name: Self-test the AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            dist/Rinne-*-x86_64.AppImage --selftest "$PWD/selftest-appimage.txt" || true
          cat selftest-appimage.txt
          grep -q "RESULT: OK" selftest-appimage.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rinne-AppImage
          path: |
            dist/Rinne-*-x86_64.AppImage
            dist/Rinne-*-x86_64.AppImage.zsync
            selftest-appimage.txt

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rinne-*-x86_64.AppImage
            dist/Rinne-*-x86_64.AppImage.zsync

      # Only the newest release is kept: once this one has all four files (the Windows workflow
      # uploads its two separately), every older release is deleted. Tags are kept.
      - name: Remove older releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')
            [ "$n" -ge 4 ] && break
            echo "Waiting for the Windows files ($n of 4 attached)…"
            sleep 30
          done
          if [ "$n" -lt 4 ]; then
            echo "The release is incomplete after 30 minutes; keeping the older releases."
            exit 0
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' |
            while read -r old; do
              if [ "$old" != "$TAG" ]; then
                echo "Deleting release $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done
