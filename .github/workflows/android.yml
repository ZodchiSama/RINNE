# Builds Rinne APKs with Qt for Python's Android deploy tool: arm64 (phones) and x86_64
# (emulators/Chromebooks). The x86_64 APK is launched on an emulator as a smoke test.
# Runs on version tags (attached to the release) or by hand from the Actions tab.

name: Android build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.10.3"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android wheels are built for CPython 3.11, so the host must match.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git zip unzip \
            autoconf automake libtool pkg-config cmake zlib1g-dev libncurses-dev libffi-dev \
            libssl-dev libltdl-dev ccache

      - name: Python tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==${QT_VERSION}" buildozer cython certifi jinja2 pkginfo tqdm "packaging==24.1"

      - name: Android wheels
        run: |
          mkdir -p wheels
          base=https://download.qt.io/official_releases/QtForPython
          a=${{ matrix.arch }}
          curl -fsSL -o wheels/PySide6-${QT_VERSION}-${QT_VERSION}-cp311-cp311-android_$a.whl \
            $base/pyside6/PySide6-${QT_VERSION}-${QT_VERSION}-cp311-cp311-android_$a.whl
          curl -fsSL -o wheels/shiboken6-${QT_VERSION}-${QT_VERSION}-cp311-cp311-android_$a.whl \
            $base/shiboken6/shiboken6-${QT_VERSION}-${QT_VERSION}-cp311-cp311-android_$a.whl
          ls -lh wheels

      - name: Cache Android SDK/NDK and build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.pyside6_android_deploy
          key: android-${{ env.QT_VERSION }}-${{ matrix.arch }}-v1

      - name: Build APK
        env:
          WHEELS: ${{ github.workspace }}/wheels
          ARCH: ${{ matrix.arch }}
        run: packaging/android/build.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rinne-Android-${{ matrix.arch }}
          path: dist/*.apk
          if-no-files-found: warn

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  # Smoke test: install the APK on an emulator, launch it, and keep a screenshot and the log.
  # (x86_64 system images from Android 11 on can run arm64 apps through binary translation.)
  emulator-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Rinne-Android-x86_64
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Rinne on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash packaging/android/emulator_smoke.sh

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rinne-Android-emulator
          path: |
            screen-*.png
            logcat*.txt
            status.txt

      - name: Fail if the app didn't stay running
        run: grep -q "^RUNNING" status.txt
